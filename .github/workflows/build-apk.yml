name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 写入签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.FV_KEYSTORE_B64 }}
          KEYSTORE_PW: ${{ secrets.FV_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fv.p12"
            echo "FV_KEYSTORE_PATH=$RUNNER_TEMP/fv.p12" >> "$GITHUB_ENV"
            echo "FV_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "FV_KEY_ALIAS=fallvault" >> "$GITHUB_ENV"
            echo "FV_KEY_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "签名密钥已就位（固定签名，可覆盖升级）"
          else
            echo "未配置签名密钥 → 本次使用调试签名"
          fi

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/FallVault.apk
          ls -la out/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FallVault-android-apk
          path: out/FallVault.apk
          if-no-files-found: error